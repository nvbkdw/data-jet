[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "data-jet"
version = "0.1.0"
description = "PyTorch-compatible DataLoader powered by Rust for zero-copy high-performance data loading"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "iniconfig==2.3.0",
    "packaging==26.0",
    "pluggy==1.6.0",
    "pygments==2.19.2",
    "py-spy>=0.4.1",
    "patchelf>=0.18.1.0a1",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "maturin==1.11.5",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "data_jet._core"
